<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            margin: 0;
            padding: 40px;
        }
        .card {
            background: white;
            max-width: 700px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h1 { color: #2563eb; }
        .button {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .button:hover {
            background: #1d4ed8;
        }
        ul { line-height: 1.8; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Portal</h1>
        <p>Welcome to your student management application.</p>
        <a class="button" href="/students">Show Students List</a>
        <p>Useful endpoints:</p>
        <ul>
            <li><a href="/students">/students</a></li>
            <li><a href="/health">/health</a></li>
        </ul>
    </div>
</body>
</html>
